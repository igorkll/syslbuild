<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-container">
        <div class="clock" id="time"></div>
        <div class="button-container">
            <button onclick="execSync('shutdown --no-wall -r now')">reboot device</button>
            <button onclick="execSync('shutdown --no-wall now')">shutdown device</button>
            <button onclick="exec('weston-terminal')">open terminal</button>
            <button onclick="ipcRenderer.send('quit-app');">close application</button>
        </div>
    </div>

    <script>
        const { execSync, exec } = require('child_process');
        const { ipcRenderer } = require('electron');

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
        }
    
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
